      <label class="pt-param" data-info="decay"><span class="pt-param__label">Decay</span><span class="pt-param__row"><input class="pt-param__input" id="env-decayMs" type="number" min="0" max="5000" autocomplete="off"><span class="pt-param__unit">ms</span></span><i class="pt-param__bar" aria-hidden="true"></i></label>
