<main class="pc-main" id="main">
  <h1 class="pr-sr">polycolor: frequency color wheel for palettes that are also chords</h1>
  <section class="pc-left" aria-label="Wheel">
    <p class="pc-wheel__hint pr-eyebrow" id="wheel-hint">Click the wheel to add a color</p>
    <div class="pr-wheel pc-wheel" id="wheel">
      <div class="pr-wheel__disc" id="disc" aria-hidden="true"></div>
    </div>
    <div class="pc-masters">
      <label class="pr-field">Master saturation <span class="pr-field__unit" id="msat-read"></span>
        <input class="pr-range" id="msat" type="range" min="0" max="100" step="1">
      </label>
      <label class="pr-field">Master lightness <span class="pr-field__unit" id="mbri-read"></span>
        <input class="pr-range" id="mbri" type="range" min="0" max="100" step="1">
      </label>
    </div>
  </section>
  <section class="pc-right" aria-label="Swatches">
    <div class="pc-right__head">
      <p class="pr-eyebrow" id="count"></p>
      <div class="pr-btngroup">
        <button class="pr-btn" type="button" id="add" aria-expanded="false" aria-controls="add-form"><span class="pr-icon" aria-hidden="true">add</span>Add color</button>
        <button class="pr-btn" type="button" id="new"><span class="pr-icon" aria-hidden="true">note_add</span>New palette</button>
      </div>
    </div>
    <form class="pc-add" id="add-form" hidden>
      <label class="pr-field">Hex, RGB or HSL, or paste several hex codes
        <input class="pr-input pc-add__input" id="add-input" type="text" autocomplete="off" spellcheck="false" placeholder="#FF8C00">
      </label>
      <p class="pc-hint" id="add-hint"></p>
      <div class="pr-btngroup"><button class="pr-btn pr-btn--primary" type="submit">Add</button><button class="pr-btn" type="button" id="add-cancel">Cancel</button></div>
    </form>
    <div class="pc-empty" id="empty">No colors yet. Click the wheel, or use Add color.</div>
    <div class="pc-swatches" id="swatches"></div>
  </section>
</main>
